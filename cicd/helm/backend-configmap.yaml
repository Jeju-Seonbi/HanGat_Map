apiVersion: v1
kind: ConfigMap

metadata:
  name: hangat-backend-config
  namespace: hangat
  labels:
    app.kubernetes.io/name: hangat-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: hangat

data:
  # ────────────────────────── Spring ──────────────────────────

  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  TZ: "Asia/Seoul"

  JAVA_TOOL_OPTIONS: >-
    -XX:MaxRAMPercentage=75.0
    -XX:+ExitOnOutOfMemoryError
    -Djava.io.tmpdir=/tmp

  # ────────────────────────── DB ──────────────────────────

  DB_URL: "jdbc:mariadb://mariadb.fileinnout.svc.cluster.local:3306/hangat"

  # ────────────────────────── 메일 ──────────────────────────

  MAIL_HOST: "smtp.resend.com"
  MAIL_PORT: "587"
  MAIL_USERNAME: "resend"
  MAIL_FROM: "no-reply@fileinnout.com"

  # ────────────────────────── 프론트엔드 ──────────────────────────

  FRONTEND_URL: "https://hangatjeju.com"
  CORS_ALLOWED_ORIGINS: "https://hangatjeju.com"

  # ────────────────────────── 공공 API ──────────────────────────

  TOUR_API_BASE_URL: "https://apis.data.go.kr/B551011/KorService2/areaBasedList2"
  CONGESTION_API_BASE_URL: "https://apis.data.go.kr/B551011/TatsCnctrRateService/tatsCnctrRatedList"

  # ────────────────────────── 파일 저장 ──────────────────────────

  APP_UPLOAD_DIR: "/app/uploads/reviews"

  # ────────────────────────── 상태 검사 ──────────────────────────

  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"