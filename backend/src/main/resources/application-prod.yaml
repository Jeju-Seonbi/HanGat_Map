# 운영(OCI) 프로필 - 모든 비밀값은 서버 환경변수로 주입한다 (파일에 직접 기입 금지)
spring:
  application:
    name: hangat-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      # Nexus는 update였으나 운영 스키마 보호를 위해 validate로 시작 (팀 협의로 변경 가능)
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

# 날씨 조회용 API
weather:
  base-url: https://apis.data.go.kr/1360000
  service-key: ${SERVICE_KEY}

tour-api:
  base-url: ${TOUR_API_BASE_URL}
  service-key: ${TOUR_API_SERVICE_KEY}

congestion-api:
  base-url: ${CONGESTION_API_BASE_URL}
  service-key: ${TOUR_API_SERVICE_KEY}
