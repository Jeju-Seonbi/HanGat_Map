spring:
  application:
    name: hangat-api

  # 기본값은 backend/docker-compose.yml 의 MariaDB와 일치 - .env 없이도 부팅된다
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/hangatmap}
    username: ${DB_USER:root}
    password: ${DB_PASS:qwer1234}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # 테이블 생성(ddl-auto) 후에 시드 SQL을 실행하기 위한 지연 설정
    defer-datasource-initialization: true
    properties:
      hibernate:
        default_batch_fetch_size: 100

  # dev 전용 시드 - INSERT IGNORE 라 매 부팅 재실행돼도 안전 (생성: scripts/build_seed_sql.py)
  sql:
    init:
      mode: always
      data-locations: classpath:seed-dev.sql

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info

# 날씨 조회용 API
weather:
  base-url: https://apis.data.go.kr/1360000
  service-key: ${SERVICE_KEY}
