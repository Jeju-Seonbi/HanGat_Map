# 테스트 전용 - 인메모리 H2를 MariaDB 호환 모드로 사용 (외부 DB 불필요)
spring:
  datasource:
    url: jdbc:h2:mem:hangat;MODE=MariaDB;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver


  jpa:
    hibernate:
      ddl-auto: create-drop

# 테스트용 더미 - 실제 호출 없음 (WeatherClient 테스트는 목으로 대체)
weather:
  base-url: http://localhost
  service-key: test-key

# 테스트용 더미 - 실호출은 PublicApiClientManualTest(@Disabled)에서만 한다
public-api:
  service-key: test-key
  tour-base-url: http://localhost
