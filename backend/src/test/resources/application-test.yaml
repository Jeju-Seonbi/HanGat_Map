# 테스트 전용 - 인메모리 H2를 MariaDB 호환 모드로 사용 (외부 DB 불필요)
spring:
  datasource:
    url: jdbc:h2:mem:hangat;MODE=MariaDB;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 테스트에는 마스터 데이터를 넣지 않는다.
  # H2는 임베디드라 기본값(embedded)으로도 data.sql이 실행되는데,
  # 테이블 생성 전에 돌아 'table not found'로 테스트가 통째로 깨진다.
  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop

# 테스트용 더미 - 실제 호출 없음 (WeatherClient 테스트는 목으로 대체)
weather:
  base-url: http://localhost
  service-key: test-key
