# 로컬 개발용 MariaDB - 실행: docker compose up -d
services:
  mariadb:
    image: mariadb:11.4
    container_name: hangat-mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: qwer1234
      MARIADB_DATABASE: hangatmap
    volumes:
      - hangat-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  hangat-db:
