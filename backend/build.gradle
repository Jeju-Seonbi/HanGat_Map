plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 요청 DTO 검증 (@Valid, @NotBlank 등) - web 스타터에 포함되지 않는다
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // .env 로딩 (로컬 개발용 - 배포 환경은 실제 환경변수 사용)
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    // --- DB ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.4.1'

    // --- Security + JWT (Nexus와 동일 - 필터 구현은 회원 담당) ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-orgjson:0.12.6'

    // --- API 문서 (Swagger UI: /swagger-ui.html) ---
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 테스트는 인메모리 H2(MariaDB 모드) - 로컬 DB 없이도 빌드·CI 통과
    testRuntimeOnly 'com.h2database:h2'
}

bootJar {
    archiveFileName = 'hangat-api.jar'
}

// TODO(임시, 2026-08-26): dev에 user 서비스 구현 파일이 누락 커밋되어 컴파일이 깨짐
// 담당자가 수정 푸시하면 이 블록을 제거할 것
tasks.named('compileJava') {
    exclude 'com/example/hangat/user/**'
}

tasks.named('test') {
    useJUnitPlatform()
}
